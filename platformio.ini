[platformio]
default_envs = esp32-s3-supermini

[env:esp32-s3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; SuperMini ESP32-S3FH4R2: 4 MB flash, 2 MB quad PSRAM.
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; Autosleep is configured only in include/ProjectConfig.h.

monitor_speed = 115200
upload_speed = 115200
; Native USB can remain in download mode after an RTS-only reset.
board_upload.after_reset = watchdog-reset
; Use the standalone NimBLE stack required by the local keyboard library.
lib_ignore = BLE
lib_ldf_mode = chain+
lib_deps =
    ESP32 BLE Keyboard=symlink://ESP32-BLE-Keyboard-master
    h2zero/NimBLE-Arduino @ 2.5.1
    igorantolic/Ai Esp32 Rotary Encoder @ 1.7
    mickey9801/MultiButtons @ 1.0.1
