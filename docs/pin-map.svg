<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RingosRemote ESP32-S3 pin map</title>
  <desc id="desc">Logical input and status LED GPIO assignments for the ESP32-S3 SuperMini BLE media controller.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="board" x2="1" y2="1">
      <stop offset="0" stop-color="#1c715f"/>
      <stop offset="1" stop-color="#155247"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".4"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #a7b4c7; }
      .label { fill: #e7eef8; font-size: 17px; font-weight: 600; }
      .small { fill: #a7b4c7; font-size: 14px; }
      .pin { fill: #c9d4e2; font-size: 14px; font-weight: 700; }
      .card { fill: #172338; stroke: #31425c; stroke-width: 1.5; }
      .trace { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="58" y="70" fill="#f1f5fb" font-size="31" font-weight="750">RingosRemote - ESP32-S3 SuperMini</text>
  <text x="58" y="102" class="muted" font-size="17">Logical GPIO map - controller inputs and on-board status LED</text>

  <g filter="url(#shadow)">
    <rect x="472" y="145" width="256" height="475" rx="30" fill="url(#board)" stroke="#58a991" stroke-width="2"/>
    <rect x="531" y="126" width="138" height="34" rx="9" fill="#26374c" stroke="#61718a"/>
    <text x="600" y="148" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700">USB-C</text>
    <rect x="535" y="202" width="130" height="110" rx="10" fill="#172333" stroke="#4a6571"/>
    <text x="600" y="246" text-anchor="middle" fill="#edf5f1" font-size="19" font-weight="750">ESP32-S3</text>
    <text x="600" y="272" text-anchor="middle" fill="#a8c7bc" font-size="13">FH4R2 · SuperMini</text>
    <circle cx="600" cy="382" r="31" fill="#163c39" stroke="#75cbb0" stroke-width="2"/>
    <circle cx="600" cy="382" r="13" fill="#3fbf82"/>
    <text x="600" y="436" text-anchor="middle" fill="#d7ebe4" font-size="14" font-weight="650">On-board RGB</text>
    <text x="600" y="458" text-anchor="middle" fill="#a8c7bc" font-size="13">GPIO 48</text>
    <text x="600" y="554" text-anchor="middle" fill="#b2d1c5" font-size="13">GPIO map only — verify your board revision</text>
  </g>

  <g>
    <rect x="56" y="171" width="310" height="112" rx="18" class="card"/>
    <text x="82" y="207" class="label">Rotary encoder</text>
    <text x="82" y="237" class="small">A / B: volume control</text>
    <text x="82" y="262" class="small">Push switch: mute</text>
    <path d="M366 220 H410 V238 H472" class="trace" stroke="#67b8ff"/>
    <path d="M366 248 H426 V278 H472" class="trace" stroke="#a78bfa"/>
    <path d="M366 272 H442 V318 H472" class="trace" stroke="#ffc46b"/>
    <circle cx="472" cy="238" r="5" fill="#67b8ff"/>
    <circle cx="472" cy="278" r="5" fill="#a78bfa"/>
    <circle cx="472" cy="318" r="5" fill="#ffc46b"/>
    <text x="423" y="231" text-anchor="end" class="pin">GPIO 12 · A</text>
    <text x="439" y="271" text-anchor="end" class="pin">GPIO 11 · B</text>
    <text x="455" y="311" text-anchor="end" class="pin">GPIO 13 - SW</text>
  </g>

  <g>
    <rect x="834" y="171" width="310" height="112" rx="18" class="card"/>
    <text x="860" y="207" class="label">Three-button ladder</text>
    <text x="860" y="237" class="small">Previous / Play-Pause / Next</text>
    <text x="860" y="262" class="small">Shared analog input</text>
    <path d="M728 350 H780 V220 H834" class="trace" stroke="#f472b6"/>
    <circle cx="728" cy="350" r="5" fill="#f472b6"/>
    <text x="770" y="343" text-anchor="end" class="pin">GPIO 8 · ADC</text>
  </g>

  <g>
    <rect x="56" y="357" width="310" height="169" rx="18" class="card"/>
    <text x="82" y="394" class="label">Firmware behavior</text>
    <text x="82" y="426" class="small">Input arms only after HID is ready</text>
    <text x="82" y="451" class="small">Reconnect gestures are discarded</text>
    <text x="82" y="486" fill="#c5d2e2" font-size="13">Single-button ADC windows (12-bit):</text>
    <text x="82" y="509" fill="#c5d2e2" font-size="13">600-810 / 1400-1620 / 2200-2380</text>
  </g>

  <g>
    <rect x="834" y="357" width="310" height="169" rx="18" class="card"/>
    <text x="860" y="394" class="label">Status LED</text>
    <text x="860" y="426" class="small">Red: disconnected</text>
    <text x="860" y="451" class="small">Blinking green: advertising</text>
    <text x="860" y="476" class="small">Amber: connecting / Green: HID ready</text>
    <text x="860" y="509" fill="#c5d2e2" font-size="13">Built in; GPIO 48</text>
  </g>

  <rect x="56" y="570" width="1088" height="85" rx="16" fill="#2a241b" stroke="#8b6b36"/>
  <path d="M82 594 l10 18 h-20 z" fill="#f6bd60"/>
  <text x="108" y="601" fill="#f6d89e" font-size="15" font-weight="700">Not a fabrication-ready schematic</text>
  <text x="108" y="627" fill="#d5c5a5" font-size="14">GPIO assignments are documented; button-ladder topology and resistor values are unknown.</text>
  <text x="108" y="647" fill="#d5c5a5" font-size="14">Do not infer component values from ADC readings. Confirm your hardware before wiring.</text>
</svg>
